# Cargo configuration for wasm32-unknown-emscripten target

[target.wasm32-unknown-emscripten]
# The Rust library is linked into DuckDB as a WASM side module.
rustflags = [
    # Rust panics cannot cross the C ABI; abort rather than unwinding into C++.
    "-C", "panic=abort",
    "-C", "link-arg=-sERROR_ON_UNDEFINED_SYMBOLS=0",
    "-C", "link-arg=-O1"
]
