[package]
name = "opaque-client"
version = "0.1.0"
edition = "2021"

[lib]
# staticlib for standalone C FFI builds (native and WASM)
# lib (rlib) for the client crate tests
# Note: cdylib removed - not supported on musl targets and not needed for our use case
crate-type = ["staticlib", "lib"]

[dependencies]
boilstream-protocol-client = { path = "../protocol-client" }
# Upstream RustCrypto migration removes the vulnerable crypto-bigint 0.5 chain.
# Pin the reviewed source until an upstream release includes this fix.
opaque-ke = { git = "https://github.com/facebook/opaque-ke", rev = "027abbc91115baa38b70ad3af7f5a22f072f978b" }
rand = "0.10"
sha2_opaque = { package = "sha2", version = "0.11" }
base64 = "0.22"
sha2 = "0.10.9"
hmac = "0.12.1"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
hex = "0.4.3"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
