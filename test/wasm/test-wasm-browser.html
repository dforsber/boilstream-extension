<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuckDB WASM Boilstream Extension Test</title>
  <style>
    body {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 {
      color: #4ec9b0;
      border-bottom: 2px solid #4ec9b0;
      padding-bottom: 10px;
    }
    .log-container {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 15px;
      margin: 20px 0;
      max-height: 600px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .log-entry {
      margin: 5px 0;
      padding: 5px;
    }
    .log-info { color: #4fc1ff; }
    .log-success { color: #4ec9b0; }
    .log-error { color: #f48771; }
    .log-warning { color: #dcdcaa; }
    .log-data { color: #ce9178; margin-left: 20px; }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      margin: 10px 5px 10px 0;
    }
    button:hover {
      background: #1177bb;
    }
    button:disabled {
      background: #3e3e42;
      cursor: not-allowed;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      margin: 10px 0;
      font-weight: bold;
    }
    .status-running { background: #1e3a5f; color: #4fc1ff; }
    .status-success { background: #1e3a2f; color: #4ec9b0; }
    .status-error { background: #3a1e1e; color: #f48771; }
  </style>
</head>
<body>
  <h1>🦆 DuckDB WASM + Boilstream Extension Test</h1>

  <div style="margin: 20px 0; padding: 15px; background: #252526; border: 1px solid #3e3e42; border-radius: 4px;">
    <label for="bootstrapToken" style="display: block; margin-bottom: 5px; color: #4ec9b0;">Bootstrap Token:</label>
    <input
      type="text"
      id="bootstrapToken"
      placeholder="Paste your bootstrap token here"
      style="width: 100%; padding: 8px; background: #1e1e1e; border: 1px solid #3e3e42; color: #d4d4d4; border-radius: 3px; font-family: inherit; font-size: 13px; margin-bottom: 8px;"
    />
    <small style="color: #858585; display: block;">Will be used with endpoint: https://localhost/secrets/:TOKEN</small>
  </div>

  <div>
    <button id="runTestBtn" onclick="runTest()">Run Test</button>
    <button id="clearBtn" onclick="clearLog()">Clear Log</button>
    <span id="status"></span>
  </div>

  <div class="log-container" id="logContainer"></div>

  <script type="module">
    import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/+esm';

    let db = null;
    let conn = null;

    function log(message, type = 'info') {
      const container = document.getElementById('logContainer');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;

      if (typeof message === 'object') {
        entry.textContent = JSON.stringify(message, null, 2);
        entry.className += ' log-data';
      } else {
        entry.textContent = message;
      }

      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }

    function setStatus(text, type) {
      const status = document.getElementById('status');
      status.textContent = text;
      status.className = `status status-${type}`;
    }

    function clearLog() {
      document.getElementById('logContainer').innerHTML = '';
      setStatus('', '');
    }

    async function runTest() {
      const btn = document.getElementById('runTestBtn');
      btn.disabled = true;
      clearLog();

      try {
        setStatus('Running...', 'running');
        log('╔════════════════════════════════════════════════════════════╗');
        log('║  DuckDB WASM + Boilstream Extension Test                 ║');
        log('╚════════════════════════════════════════════════════════════╝');
        log('');

        // Step 1: Load DuckDB WASM
        log('ℹ Step 1: Loading DuckDB WASM bundles...', 'info');
        const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
        const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

        // Determine which WASM format was selected (eh or mvp)
        let wasmFormat = 'wasm_eh'; // default
        if (bundle.mainWorker.includes('mvp')) {
          wasmFormat = 'wasm_mvp';
        } else if (bundle.mainWorker.includes('coi')) {
          wasmFormat = 'wasm_threads';
        }

        log(`✓ Bundle selected: ${wasmFormat}`, 'success');
        log(`  Worker: ${bundle.mainWorker.split('/').pop()}`, 'info');

        // Step 2: Create worker with blob URL to avoid CORS
        log('', 'info');
        log('ℹ Step 2: Creating worker...', 'info');

        // Fetch the worker script and create a blob URL
        const workerResponse = await fetch(bundle.mainWorker);
        const workerBlob = await workerResponse.blob();
        const workerUrl = URL.createObjectURL(workerBlob);

        const worker = new Worker(workerUrl);
        const logger = new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING);
        log('✓ Worker created', 'success');

        // Step 3: Instantiate DuckDB
        log('', 'info');
        log('ℹ Step 3: Instantiating DuckDB...', 'info');

        db = new duckdb.AsyncDuckDB(logger, worker);
        await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
        log('✓ DuckDB instantiated', 'success');

        // Open database with configuration to allow unsigned extensions
        log('', 'info');
        log('ℹ Step 3.5: Opening database with allowUnsignedExtensions=true...', 'info');
        await db.open({
          allowUnsignedExtensions: true,
          query: {
            castBigIntToDouble: true,
          }
        });
        log('✓ Database opened with unsigned extensions allowed', 'success');

        // Step 4: Connect
        log('', 'info');
        log('ℹ Step 4: Opening connection...', 'info');
        conn = await db.connect();
        log('✓ Connection opened', 'success');

        // Step 4.5: Ensure unsigned extensions are allowed (fallback)
        log('', 'info');
        log('ℹ Step 4.5: Verifying allow_unsigned_extensions setting...', 'info');
        try {
          const settingResult = await conn.query("SELECT value FROM duckdb_settings() WHERE name = 'allow_unsigned_extensions'");
          const settingRows = settingResult.toArray();
          if (settingRows.length > 0) {
            log(`  Current setting: ${settingRows[0].value}`, 'info');
            if (settingRows[0].value !== 'true') {
              log('  ⚠️  Setting is not enabled, extension loading will likely fail', 'warning');
            } else {
              log('✓ Unsigned extensions are allowed', 'success');
            }
          }
        } catch (e) {
          log(`  Note: Could not verify setting: ${e.message}`, 'warning');
        }

        // Step 5: Test basic query
        log('', 'info');
        log('ℹ Step 5: Running basic query (SELECT 42)...', 'info');
        const result = await conn.query('SELECT 42 as answer');
        const rows = result.toArray();
        log('✓ Query executed', 'success');
        log(rows, 'data');

        if (rows.length === 1 && rows[0].answer === 42) {
          log('✓ Result verified', 'success');
        } else {
          throw new Error('Unexpected result');
        }

        // Step 6: Load boilstream extension
        log('', 'info');
        log('ℹ Step 6: Loading boilstream extension...', 'info');
        log('  Attempting to load from localhost web server', 'info');

        try {
          // Full URL to WASM extension file served by localhost
          // Use the same WASM format as the DuckDB bundle
          // Note: duckdb-wasm@1.32.0 is based on DuckDB v1.4.3
          const duckdbVersion = 'v1.4.3';
          const extensionUrl = `http://localhost:8080/build/${wasmFormat}/repository/${duckdbVersion}/${wasmFormat}/boilstream.duckdb_extension.wasm`;

          log(`  Extension URL: ${extensionUrl}`, 'info');
          log(`  Using format: ${wasmFormat} (matches DuckDB bundle)`, 'info');
          log(`  DuckDB version: ${duckdbVersion} (using duckdb-wasm@1.32.0)`, 'info');

          // Try to fetch the extension to verify it exists
          const testFetch = await fetch(extensionUrl);
          if (!testFetch.ok) {
            throw new Error(`Extension file not found at ${extensionUrl} (HTTP ${testFetch.status})`);
          }
          log('✓ Extension file found on server', 'success');

          // Install and load the extension using full HTTP URL
          await conn.query(`INSTALL '${extensionUrl}'`);
          log('✓ Boilstream extension installed', 'success');

          // Load using the same full URL
          await conn.query(`LOAD '${extensionUrl}'`);
          log('✓ Boilstream extension loaded!', 'success');

          // Check loaded extensions
          log('', 'info');
          log('ℹ Step 7: Verifying extension is loaded...', 'info');
          const extResult = await conn.query("SELECT * FROM duckdb_extensions() WHERE extension_name = 'boilstream'");
          const extRows = extResult.toArray();
          log('✓ Extension info retrieved', 'success');
          log(extRows, 'data');

          if (extRows.length > 0 && extRows[0].loaded) {
            log('✅ Extension is loaded!', 'success');

            // Step 7b: Test boilstream_help PRAGMA (works without authentication)
            log('', 'info');
            log('ℹ Step 7b: Testing PRAGMA boilstream_help...', 'info');
            try {
              const helpResult = await conn.query("PRAGMA boilstream_help()");
              const helpRows = helpResult.toArray();
              log('✓ boilstream_help PRAGMA works', 'success');
              log(`  Returned ${helpRows.length} help lines`, 'info');
            } catch (helpErr) {
              log('⚠️  boilstream_help failed: ' + helpErr.message, 'warning');
            }

            // Step 7c: Verify all PRAGMAs are registered
            log('', 'info');
            log('ℹ Step 7c: Verifying all PRAGMAs are registered...', 'info');
            const pragmasToCheck = [
              'boilstream_bootstrap_session',
              'boilstream_create_ducklake',
              'boilstream_register_user',
              'boilstream_verify_mfa',
              'boilstream_login',
              'boilstream_help'
            ];

            for (const pragma of pragmasToCheck) {
              try {
                // Query pragma_list to check if PRAGMA is registered
                const checkResult = await conn.query(`SELECT * FROM duckdb_functions() WHERE function_name = '${pragma}' AND function_type = 'pragma'`);
                const checkRows = checkResult.toArray();
                if (checkRows.length > 0) {
                  log(`  ✓ PRAGMA ${pragma} is registered`, 'success');
                } else {
                  log(`  ⚠️  PRAGMA ${pragma} not found in function list`, 'warning');
                }
              } catch (err) {
                log(`  ⚠️  Could not check ${pragma}: ${err.message}`, 'warning');
              }
            }

            // Step 7d: Verify table functions are registered
            log('', 'info');
            log('ℹ Step 7d: Verifying table functions are registered...', 'info');
            const tableFuncsToCheck = [
              'boilstream_secrets',
              'boilstream_ducklakes',
              'boilstream_buckets'
            ];

            for (const func of tableFuncsToCheck) {
              try {
                const checkResult = await conn.query(`SELECT * FROM duckdb_functions() WHERE function_name = '${func}' AND function_type = 'table'`);
                const checkRows = checkResult.toArray();
                if (checkRows.length > 0) {
                  log(`  ✓ Table function ${func}() is registered`, 'success');
                } else {
                  log(`  ⚠️  Table function ${func}() not found`, 'warning');
                }
              } catch (err) {
                log(`  ⚠️  Could not check ${func}: ${err.message}`, 'warning');
              }
            }

            // Test if PRAGMA function is registered
            log('', 'info');
            log('ℹ Step 8: Testing authentication flow...', 'info');

            // Try to auto-fetch bootstrap token from auth server
            let bootstrapToken = null;

            log('ℹ Step 8.1: Attempting to auto-fetch bootstrap token from SSO...', 'info');
            try {
              const tokenResponse = await fetch('/auth/api/bootstrap-token', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
              });

              if (tokenResponse.ok) {
                const tokenData = await tokenResponse.json();
                bootstrapToken = tokenData.bootstrap_token;
                log('✅ Bootstrap token auto-fetched from SSO!', 'success');
                log(`  Token: ${bootstrapToken.substring(0, 20)}...`, 'info');
              } else {
                log(`⚠️  SSO token fetch failed (HTTP ${tokenResponse.status})`, 'warning');
              }
            } catch (err) {
              log('⚠️  Could not auto-fetch token: ' + err.message, 'warning');
            }

            // Fallback to manual input if auto-fetch failed
            if (!bootstrapToken) {
              const tokenInput = document.getElementById('bootstrapToken');
              bootstrapToken = tokenInput.value.trim();

              if (bootstrapToken) {
                log('ℹ Using manually entered bootstrap token', 'info');
              }
            }

            if (!bootstrapToken) {
              log('⚠️  No bootstrap token available (SSO not logged in and no manual token)', 'warning');
              log('✅ Extension loaded successfully (provide token to test authentication)', 'success');
              setStatus('✅ Extension loaded (no token)', 'success');
            } else {
              // Construct full URL with token
              const endpointUrl = `https://localhost/secrets/:${bootstrapToken}`;
              log(`  Using endpoint: https://localhost/secrets/:${bootstrapToken.substring(0, 20)}...`, 'info');

              try {
                // Test: Call PRAGMA with full implementation
                log('  Testing PRAGMA boilstream_bootstrap_session...', 'info');
                const result = await conn.query(`PRAGMA boilstream_bootstrap_session('${endpointUrl}')`);
                const rows = result.toArray();
                log('✅ PRAGMA executed successfully!', 'success');
                log('Result:', 'success');
                log(rows, 'data');

                // Step 9: List secrets from boilstream server
                log('', 'info');
                log('ℹ Step 9: Listing secrets from boilstream server...', 'info');
                try {
                  const secretsResult = await conn.query("SELECT * FROM boilstream_secrets()");
                  const secretsRows = secretsResult.toArray();
                  log('✓ Boilstream secrets retrieved', 'success');
                  log(`Found ${secretsRows.length} secret(s) on server:`, 'success');

                  if (secretsRows.length > 0) {
                    secretsRows.forEach((secret, index) => {
                      log(`\nSecret #${index + 1}:`, 'info');
                      log(secret, 'data');
                    });
                  } else {
                    log('  No secrets provisioned on server yet', 'warning');
                    log('  Ducklakes require S3 credentials to be attached', 'info');
                  }
                } catch (secretsErr) {
                  log('⚠️  Could not retrieve boilstream secrets: ' + secretsErr.message, 'warning');
                }

                // Also check local DuckDB secrets
                log('', 'info');
                log('ℹ Step 9b: Checking local DuckDB secrets cache...', 'info');
                try {
                  const localSecretsResult = await conn.query("SELECT * FROM duckdb_secrets()");
                  const localSecretsRows = localSecretsResult.toArray();
                  log(`Found ${localSecretsRows.length} secret(s) in local cache`, 'info');
                } catch (localSecretsErr) {
                  log('⚠️  Could not check local secrets: ' + localSecretsErr.message, 'warning');
                }

                // Step 9c: List buckets from boilstream server
                log('', 'info');
                log('ℹ Step 9c: Listing S3 buckets from boilstream server...', 'info');
                try {
                  const bucketsResult = await conn.query("SELECT * FROM boilstream_buckets()");
                  const bucketsRows = bucketsResult.toArray();
                  log('✓ Buckets retrieved', 'success');
                  log(`Found ${bucketsRows.length} bucket(s):`, 'success');

                  if (bucketsRows.length > 0) {
                    bucketsRows.forEach((bucket, index) => {
                      log(`\nBucket #${index + 1}:`, 'info');
                      log(bucket, 'data');
                    });
                  } else {
                    log('  No S3 buckets configured for your account', 'info');
                  }
                } catch (bucketsErr) {
                  log('⚠️  Could not retrieve buckets: ' + bucketsErr.message, 'warning');
                }

                // Step 10: List ducklakes after successful authentication
                log('', 'info');
                log('ℹ Step 10: Listing ducklakes from boilstream server...', 'info');
                try {
                  const ducklakesResult = await conn.query("SELECT * FROM boilstream_ducklakes()");
                  let ducklakesRows = ducklakesResult.toArray();
                  log('✓ Ducklakes retrieved', 'success');
                  log(`Found ${ducklakesRows.length} ducklake(s):`, 'success');

                  if (ducklakesRows.length > 0) {
                    ducklakesRows.forEach((ducklake, index) => {
                      log(`\nDucklake #${index + 1}:`, 'info');
                      log(ducklake, 'data');
                    });
                  } else {
                    log('  No ducklakes found - will try to create one', 'warning');
                  }

                  // Step 10b: Try to create a test ducklake (demonstrates PRAGMA boilstream_create_ducklake)
                  log('', 'info');
                  log('ℹ Step 10b: Testing PRAGMA boilstream_create_ducklake...', 'info');
                  const testDucklakeName = `wasm_test_lake_${Date.now()}`;
                  try {
                    const createResult = await conn.query(`PRAGMA boilstream_create_ducklake('${testDucklakeName}', 'WASM integration test ducklake')`);
                    const createRows = createResult.toArray();
                    log(`✓ Created test ducklake "${testDucklakeName}"`, 'success');
                    log('Result:', 'success');
                    log(createRows, 'data');

                    // Refresh ducklakes list
                    const refreshResult = await conn.query("SELECT * FROM boilstream_ducklakes()");
                    ducklakesRows = refreshResult.toArray();
                    log(`  Ducklakes list refreshed: now ${ducklakesRows.length} ducklake(s)`, 'info');
                  } catch (createErr) {
                    if (createErr.message.includes('already exists')) {
                      log(`⚠️  Ducklake "${testDucklakeName}" already exists`, 'warning');
                    } else if (createErr.message.includes('permission') || createErr.message.includes('unauthorized')) {
                      log('⚠️  No permission to create ducklakes (this is expected for some accounts)', 'warning');
                    } else {
                      log(`⚠️  Could not create test ducklake: ${createErr.message}`, 'warning');
                    }
                    log('  Note: boilstream_create_ducklake requires appropriate server permissions', 'info');
                  }

                  // Step 11: Try to attach the first ducklake
                  if (ducklakesRows.length > 0) {
                    const firstDucklake = ducklakesRows[0];
                    const catalogName = firstDucklake.catalog_name;

                    log('', 'info');
                    log(`ℹ Step 11: Attempting to ATTACH ducklake "${catalogName}"...`, 'info');
                    try {
                      // First check if already attached
                      const attachedResult = await conn.query(`SELECT * FROM duckdb_databases() WHERE database_name = '${catalogName}'`);
                      const attachedRows = attachedResult.toArray();

                      if (attachedRows.length > 0) {
                        log(`✓ Ducklake "${catalogName}" is already attached`, 'success');
                      } else {
                        // Try to attach using ducklake extension
                        await conn.query(`ATTACH '' AS ${catalogName} (TYPE ducklake)`);
                        log(`✓ Ducklake "${catalogName}" attached successfully`, 'success');
                      }

                      // Step 12: USE the ducklake
                      log('', 'info');
                      log(`ℹ Step 12: Switching to ducklake "${catalogName}"...`, 'info');
                      await conn.query(`USE ${catalogName}`);
                      log(`✓ Now using ducklake "${catalogName}"`, 'success');

                      // Step 13: Create a test table
                      log('', 'info');
                      log('ℹ Step 13: Creating test table...', 'info');
                      const testTableName = `wasm_test_${Date.now()}`;
                      try {
                        await conn.query(`CREATE TABLE ${testTableName} (id INTEGER, name VARCHAR, created_at TIMESTAMP)`);
                        log(`✓ Created table "${testTableName}"`, 'success');

                        // Step 14: Insert test data
                        log('', 'info');
                        log('ℹ Step 14: Inserting test data...', 'info');
                        await conn.query(`INSERT INTO ${testTableName} VALUES
                          (1, 'WASM Test Row 1', now()),
                          (2, 'WASM Test Row 2', now()),
                          (3, 'WASM Test Row 3', now())`);
                        log('✓ Inserted 3 test rows', 'success');

                        // Step 15: Query the data back
                        log('', 'info');
                        log('ℹ Step 15: Querying test data...', 'info');
                        const queryResult = await conn.query(`SELECT * FROM ${testTableName} ORDER BY id`);
                        const queryRows = queryResult.toArray();
                        log(`✓ Query returned ${queryRows.length} rows:`, 'success');
                        queryRows.forEach((row, index) => {
                          log(row, 'data');
                        });

                        // Step 16: Clean up - drop the test table
                        log('', 'info');
                        log('ℹ Step 16: Cleaning up test table...', 'info');
                        await conn.query(`DROP TABLE ${testTableName}`);
                        log(`✓ Dropped table "${testTableName}"`, 'success');

                        log('', 'success');
                        log('🎉 Full ducklake read/write test completed successfully!', 'success');

                      } catch (tableErr) {
                        log(`⚠️  Table operations failed: ${tableErr.message}`, 'warning');
                        log('This may be due to missing S3 credentials for the ducklake', 'info');
                      }

                    } catch (attachErr) {
                      log(`⚠️  Could not attach ducklake: ${attachErr.message}`, 'warning');
                      log('This may be due to missing ducklake extension or S3 credentials', 'info');
                    }
                  }
                } catch (ducklakesErr) {
                  log('⚠️  Could not retrieve ducklakes: ' + ducklakesErr.message, 'warning');
                }

                setStatus('✅ Authentication successful!', 'success');
              } catch (err) {
                if (err.message.includes('Token exchange failed') ||
                    err.message.includes('Connection refused') ||
                    err.message.includes('Could not connect') ||
                    err.message.includes('OPAQUE login failed')) {
                  log('⚠️  PRAGMA function executed but authentication failed', 'warning');
                  log('Error: ' + err.message, 'warning');
                  log('This is expected if the auth server is not running or token is invalid', 'info');
                  setStatus('⚠️ Extension works, auth failed', 'warning');
                } else if (err.message.includes('Catalog Error') || err.message.includes('not recognized')) {
                  log('❌ PRAGMA function NOT registered', 'error');
                  log('Error: ' + err.message, 'error');
                  setStatus('⚠️  Extension loaded but PRAGMA not registered', 'warning');
                } else {
                  log('Error calling PRAGMA: ' + err.message, 'error');
                  throw err;
                }
              }
            }
          } else {
            throw new Error('Extension not properly loaded');
          }

        } catch (err) {
          log('', 'error');
          log('⚠️  Extension loading failed', 'warning');
          log(`Error: ${err.message}`, 'error');
          if (err.stack) {
            log(`Stack trace: ${err.stack}`, 'error');
          }
          log(`Error object: ${JSON.stringify(err, Object.getOwnPropertyNames(err))}`, 'error');
          log('', 'info');
          log('To fix this:', 'info');
          log('1. Ensure WASM extension is built: make wasm_threads', 'info');
          log('2. Verify file exists: ls build/wasm_threads/repository/v1.4.3/wasm_threads/boilstream.duckdb_extension.wasm', 'info');
          log('3. Ensure server is serving /build/ directory correctly', 'info');
          log('', 'info');
          log('✅ DuckDB WASM is working (extension loading needs setup)', 'success');
          setStatus('⚠️  DuckDB works, extension needs setup', 'warning');
        }

        log('', 'info');
        log('╔════════════════════════════════════════════════════════════╗');
        log('║  Test Complete                                             ║');
        log('╚════════════════════════════════════════════════════════════╝');

      } catch (error) {
        log('', 'error');
        log('✗ Test failed: ' + error.message, 'error');
        if (error.stack) {
          log(error.stack, 'error');
        }
        setStatus('❌ Test failed', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // Make function available globally
    window.runTest = runTest;
    window.clearLog = clearLog;

    // Auto-run on load
    log('Ready to test. Click "Run Test" button.', 'info');
  </script>
</body>
</html>
