<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>BoilStream DuckDB 2.0 WASM tests</title>
<h1>BoilStream DuckDB 2.0 WASM tests</h1>
<p>Runs the core browser assertions. Use npm test for the full regression harness and npm run test:compatibility for the strict Quack release gate. Both runtime and extension must match the pinned baseline.</p>
<button id="run">Run tests</button>
<pre id="result" role="status">Ready</pre>
<script type="module">
  import { runSuite, runProtocolScenario } from './suite.js';
  window.runSuite = runSuite;
  window.runProtocolScenario = runProtocolScenario;
  document.querySelector('#run').onclick = async () => {
    const button = document.querySelector('#run');
    const result = document.querySelector('#result');
    button.disabled = true;
    result.textContent = '';
    try {
      const baseline = await (await fetch('/baseline.json')).json();
      for (const variant of baseline.variants) {
        await runSuite(variant, message => { result.textContent += message + '\n'; });
      }
      result.textContent += 'PASS\n';
    } catch (error) {
      result.textContent += 'FAIL: ' + error.message + '\n';
    } finally {
      button.disabled = false;
    }
  };
</script>
</html>
