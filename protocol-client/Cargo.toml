[package]
name = "boilstream-protocol-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "tests/*.json"]
description = "Client request encryption and response verification for BoilStream"
repository = "https://github.com/dforsber/boilstream-extension"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "0.8.4", features = ["zeroize"] }
base64 = "0.22.1"
hkdf = "0.12.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
zeroize = { version = "1.8", features = ["derive"] }
# Snow 0.10's AES resolver imports AEAD traits through its ChaCha feature.
# The profile resolver still permits only AESGCM/SHA256/25519; no OS RNG.
snow = { version = "0.10.0", default-features = false, features = ["use-aes-gcm", "use-sha2", "use-curve25519", "use-chacha20poly1305"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["zeroize"] }
