#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@ae971e03c1840a1c6c2d81b91d1ec851f297f720
    with:
      duckdb_version: v2.0.0
      ci_tools_version: ae971e03c1840a1c6c2d81b91d1ec851f297f720
      extension_name: boilstream
      extra_toolchains: 'rust'
      # DuckDB 2.0 has base/EH and threads bundles; MVP is no longer supported.
      exclude_archs: 'wasm_mvp'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@ae971e03c1840a1c6c2d81b91d1ec851f297f720
    with:
      duckdb_version: v2.0.0
      ci_tools_version: ae971e03c1840a1c6c2d81b91d1ec851f297f720
      extension_name: boilstream
      format_checks: 'format;tidy'
