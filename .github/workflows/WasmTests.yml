name: DuckDB 2.0 WASM regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [wasm_eh, wasm_threads]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: test/wasm/package-lock.json
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: 6.0.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-emscripten
      - if: matrix.variant == 'wasm_threads'
        run: rustup toolchain install nightly-2026-08-06 --profile minimal --component rust-src
      - run: npm ci
        working-directory: test/wasm
      - run: npx playwright install --with-deps chromium
        working-directory: test/wasm
      - run: ./build-wasm-fixed.sh '${{ matrix.variant }}'
      - run: bash opaque-client/test-wasm/test-ffi.sh
        env:
          WASM_BUILD_TYPE: ${{ matrix.variant }}
          BOILSTREAM_RUST_WASM_LIB: ${{ github.workspace }}/build/${{ matrix.variant }}/extension/boilstream/rust/wasm32-unknown-emscripten/release/libopaque_client.a
      - run: npm test
        working-directory: test/wasm
        env:
          WASM_VARIANTS: ${{ matrix.variant }}
      - name: Require successful core Quack compatibility for release
        run: npm run test:compatibility
        working-directory: test/wasm
        env:
          WASM_VARIANTS: ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: boilstream-v2.0.0-extension-${{ matrix.variant }}
          path: build/${{ matrix.variant }}/extension/boilstream/boilstream.duckdb_extension.wasm
          if-no-files-found: error
